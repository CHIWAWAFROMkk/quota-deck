name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Build portable app
        shell: pwsh
        run: ./scripts/package-portable.ps1 -OutputName QuotaDeck
      - uses: actions/upload-artifact@v4
        with:
          name: QuotaDeck-windows-x64
          path: dist/QuotaDeck/
